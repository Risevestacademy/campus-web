# Frontend CI — Next 16 / React 19 / pnpm / Vitest / Playwright

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HUSKY: 0 # the `prepare` script runs husky on install; not wanted in CI
  NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
  NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Select public build variables
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
          STAGING_SANITY_DATASET: ${{ vars.STAGING_NEXT_PUBLIC_SANITY_DATASET }}
          STAGING_SANITY_PROJECT_ID: ${{ vars.STAGING_NEXT_PUBLIC_SANITY_PROJECT_ID }}
          PRODUCTION_SANITY_DATASET: ${{ vars.PRODUCTION_NEXT_PUBLIC_SANITY_DATASET }}
          PRODUCTION_SANITY_PROJECT_ID: ${{ vars.PRODUCTION_NEXT_PUBLIC_SANITY_PROJECT_ID }}
          STAGING_WORLD_URL: ${{ vars.STAGING_NEXT_PUBLIC_WORLD_URL }}
          PRODUCTION_WORLD_URL: ${{ vars.PRODUCTION_NEXT_PUBLIC_WORLD_URL }}
        run: |
          set -euo pipefail

          case "$TARGET_BRANCH" in
            dev)
              sanity_dataset="$STAGING_SANITY_DATASET"
              sanity_project_id="$STAGING_SANITY_PROJECT_ID"
              world_url="$STAGING_WORLD_URL"
              ;;
            main)
              sanity_dataset="$PRODUCTION_SANITY_DATASET"
              sanity_project_id="$PRODUCTION_SANITY_PROJECT_ID"
              world_url="$PRODUCTION_WORLD_URL"
              ;;
            *)
              echo "::error::Unsupported CI target branch: $TARGET_BRANCH"
              exit 1
              ;;
          esac

          if [[ -z "$sanity_dataset" || -z "$sanity_project_id" || -z "$world_url" ]]; then
            echo "::error::Public build repository variables are missing for $TARGET_BRANCH."
            exit 1
          fi

          {
            echo "NEXT_PUBLIC_SANITY_DATASET=$sanity_dataset"
            echo "NEXT_PUBLIC_SANITY_PROJECT_ID=$sanity_project_id"
            echo "NEXT_PUBLIC_WORLD_URL=$world_url"
          } >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Select public build variables
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
          STAGING_SANITY_DATASET: ${{ vars.STAGING_NEXT_PUBLIC_SANITY_DATASET }}
          STAGING_SANITY_PROJECT_ID: ${{ vars.STAGING_NEXT_PUBLIC_SANITY_PROJECT_ID }}
          PRODUCTION_SANITY_DATASET: ${{ vars.PRODUCTION_NEXT_PUBLIC_SANITY_DATASET }}
          PRODUCTION_SANITY_PROJECT_ID: ${{ vars.PRODUCTION_NEXT_PUBLIC_SANITY_PROJECT_ID }}
          STAGING_WORLD_URL: ${{ vars.STAGING_NEXT_PUBLIC_WORLD_URL }}
          PRODUCTION_WORLD_URL: ${{ vars.PRODUCTION_NEXT_PUBLIC_WORLD_URL }}
        run: |
          set -euo pipefail

          case "$TARGET_BRANCH" in
            dev)
              sanity_dataset="$STAGING_SANITY_DATASET"
              sanity_project_id="$STAGING_SANITY_PROJECT_ID"
              world_url="$STAGING_WORLD_URL"
              ;;
            main)
              sanity_dataset="$PRODUCTION_SANITY_DATASET"
              sanity_project_id="$PRODUCTION_SANITY_PROJECT_ID"
              world_url="$PRODUCTION_WORLD_URL"
              ;;
            *)
              echo "::error::Unsupported CI target branch: $TARGET_BRANCH"
              exit 1
              ;;
          esac

          if [[ -z "$sanity_dataset" || -z "$sanity_project_id" || -z "$world_url" ]]; then
            echo "::error::Public build repository variables are missing for $TARGET_BRANCH."
            exit 1
          fi

          {
            echo "NEXT_PUBLIC_SANITY_DATASET=$sanity_dataset"
            echo "NEXT_PUBLIC_SANITY_PROJECT_ID=$sanity_project_id"
            echo "NEXT_PUBLIC_WORLD_URL=$world_url"
          } >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install system deps (cache hit path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Storybook tests and build
        run: pnpm eval:storybook

      - name: E2E
        run: |
          pnpm build
          pnpm exec playwright test --project=chromium

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-artifacts
          path: |
            playwright-report/
            test-results/storybook/
          retention-days: 7
